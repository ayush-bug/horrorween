<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>A Horror Halloween</title>
</head>
<body>
    <div class="splash-container">
        <div class="splash">
            <img src="assets/haloween-removebg-preview.png" alt="haloween">
        </div>
        <h3>Are you guys ready to dive in this Horror haloween .</h3>
            <button id="splash-hide">Yeah</button>
    </div>
    <div class="intro">
        <div class="video">
            <video id="introVideo" loop src="assets/video/Halloween-Ghost.mp4" width="100%">
            </video>
        </div>
    </div>
    <div id="txt1" class="intro-text">
        <h2>The night is too quiet and silent .</h2>
        <button id="btn1">Hmm T_T</button>
    </div>
    <div id="txt2" class="intro-text">
        <h2>do you fear ghosts :D </h2>
        <button id="yes">Yes</button>
        <button id="no">NO</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
